# Tiny Tapeout project information
project:
  title:        "Crypto-Agile Fault-Detecting NTT Butterfly"
  author:       "H Vinayaka"
  discord:      ""
  description:  "Serial NTT butterfly for ML-KEM, ML-DSA and Falcon with mod-3 fault detection"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"    # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_vinayaka_pqc_ntt"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "DIN0"
  ui[1]: "DIN1"
  ui[2]: "DIN2"
  ui[3]: "DIN3"
  ui[4]: "DIN4"
  ui[5]: "DIN5"
  ui[6]: "DIN6"
  ui[7]: "DIN7"

  # Outputs
  uo[0]: "DOUT0"
  uo[1]: "DOUT1"
  uo[2]: "DOUT2"
  uo[3]: "DOUT3"
  uo[4]: "DOUT4"
  uo[5]: "DOUT5"
  uo[6]: "DOUT6"
  uo[7]: "DOUT7"

  # Bidirectional pins
  uio[0]: "WR"
  uio[1]: "START"
  uio[2]: "RD"
  uio[3]: "MODE"
  uio[4]: "SCHEME0"
  uio[5]: "SCHEME1"
  uio[6]: "BUSY"
  uio[7]: "FAULT"

# Do not change!
yaml_version: 6
